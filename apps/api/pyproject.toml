[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clubhaus-api"
version = "0.1.0"
description = "Clubhaus modular FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.138.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.3",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "uvicorn==0.49.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["clubhaus"]

[tool.ruff.format]
quote-style = "double"
