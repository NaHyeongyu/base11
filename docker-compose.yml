services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clubhaus
      POSTGRES_USER: clubhaus
      POSTGRES_PASSWORD: clubhaus
    ports:
      - "5432:5432"
    volumes:
      - clubhaus_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubhaus -d clubhaus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clubhaus_postgres:

